<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profil Saya · MYSHIFT</title>
    <meta name="description" content="Informasi akun dan akses cabang operasional Anda." />
    <!-- Terjemahan dari components/theme-script.tsx. -->
    <script>
      try {
        var s = localStorage.getItem("myshift-theme");
        var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (d) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/common.css" />
    <!-- Tanpa defer: skrip inline di <body> memakai Myshift.* saat parsing. -->
    <script src="assets/icons.js"></script>
    <script src="assets/common.js"></script>
  </head>
  <!--
    Ekstraksi dari app/(app)/profil/page.tsx.

    HALAMAN DUAL-SHELL: aslinya memilih Shell via session.role
    (petugas -> PetugasShell, selain itu -> AdminShell).
      * data-shell="admin"   -> header Admin + dock  (default contoh ini)
      * data-shell="petugas" -> header Petugas + tab bawah
    Untuk shell Petugas: ubah data-shell di bawah menjadi "petugas",
    lalu ganti contoh sesi dengan role "petugas" (snippet ada di komentar
    dekat baris nama/konteks cabang).

    Endpoint asli: GET /api/auth/session, POST /api/auth/logout (PLAN/API-CONTRACT.md).
    Contoh sesi di bawah dibakar langsung ke HTML (tanpa fetch).
  -->
  <body data-shell="admin" data-active="/profil">
    <div id="ms-root">
      <main id="main">
        <!-- PageHeader (components/shell.tsx) -->
        <div class="mb-5 flex min-w-0 flex-wrap items-start justify-between gap-3 sm:mb-6 sm:items-end">
          <div class="min-w-0 flex-1">
            <h1 class="text-xl font-bold tracking-tight text-foreground text-balance sm:text-2xl">Profil Saya</h1>
            <p class="mt-1 text-sm text-muted-foreground">Informasi akun dan akses cabang operasional Anda.</p>
          </div>
        </div>

        <!--
          motion.div initial y:16 -> animasi masuk memakai .ms-enter (lihat common.css).
          Contoh sesi admin (bawaan halaman ini).
        -->
        <div class="grid gap-6 lg:grid-cols-3">
          <!-- Profile Card -->
          <div class="min-w-0 rounded-lg border border-border bg-card p-4 shadow-sm sm:p-6 lg:col-span-2">
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">EMP-001</p>
                <h2 class="mt-1 text-xl font-bold text-foreground">Dewi Anggraini</h2>
                <div class="mt-2">
                  <!-- StatusBadge status={session.role} — role "admin" tanpa nada khusus -> fallback muted -->
                  <span class="inline-flex items-center rounded-sm px-2 py-0.5 text-xs font-medium capitalize bg-muted text-muted-foreground">admin</span>
                </div>
              </div>
              <div class="grid size-12 shrink-0 place-items-center rounded-full bg-primary/10 text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
            </div>

            <!--
              Untuk shell Petugas, ganti dua blok nilai berikut menjadi:
                <span class="text-muted-foreground">Konteks Cabang</span>
                <span class="font-medium text-foreground">Mengikuti cabang pada jadwal shift</span>
              dan badge role menjadi:
                <span class="inline-flex ... bg-muted text-muted-foreground">petugas</span>
            -->
            <div class="mt-6 divide-y divide-border border-t border-border pt-4 text-sm">
              <div class="flex items-center justify-between py-3">
                <span class="text-muted-foreground">Cabang Pengelolaan</span>
                <span class="font-medium text-foreground">Cabang Kopo (CBG001)</span>
              </div>
              <div class="flex items-start justify-between py-3">
                <span class="text-muted-foreground">Cabang Penugasan</span>
                <div class="text-right">
                  <p class="font-medium text-foreground">Cabang Kopo</p>
                  <p class="font-medium text-foreground">Cabang Buah Batu</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Session Card -->
          <div class="h-fit rounded-lg border border-border bg-card p-4 shadow-sm sm:p-6">
            <h3 class="mb-2 text-base font-semibold text-foreground">Sesi Akun</h3>
            <p class="mb-4 text-xs text-muted-foreground">
              Akhiri sesi kerja Anda saat bertukar perangkat atau selesai shift.
            </p>
            <!-- Button variant="destructive" size="default" className="w-full" -->
            <button
              type="button"
              id="btn-logout"
              class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-destructive/10 text-destructive hover:bg-destructive/20 focus-visible:border-destructive/40 focus-visible:ring-destructive/20 dark:bg-destructive/20 dark:hover:bg-destructive/30 dark:focus-visible:ring-destructive/40 h-8 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 w-full"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
              <span id="btn-logout-label">Keluar dari Akun</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script>
      /* Endpoint asli: POST /api/auth/logout (lihat PLAN/API-CONTRACT.md). */
      window.MS_MOCKS = {
        "/api/auth/session": {
          employeeId: "EMP-001",
          nama: "Dewi Anggraini",
          role: "admin",
          activeBranchId: "CBG001",
          branches: [
            { branchId: "CBG001", nama: "Cabang Kopo" },
            { branchId: "CBG002", nama: "Cabang Buah Batu" },
          ],
        },
        "/api/auth/logout": { success: true },
      };

      /* handleLogout: set label "Mengakhiri sesi..." selama request (sama seperti aslinya). */
      document.getElementById("btn-logout").addEventListener("click", async function () {
        var btn = this;
        var label = document.getElementById("btn-logout-label");
        btn.disabled = true;
        label.textContent = "Mengakhiri sesi...";
        try {
          await Myshift.request("/api/auth/logout", { method: "POST" });
          Myshift.toast("Berhasil keluar", "success");
          setTimeout(function () { location.href = "login.html"; }, 600);
        } catch (e) {
          Myshift.toast(e.message || "Gagal keluar", "error");
          btn.disabled = false;
          label.textContent = "Keluar dari Akun";
        }
      });
    </script>
  </body>
</html>
