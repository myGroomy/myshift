<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk · MYSHIFT</title>
    <meta name="description" content="Masuk ke MYSHIFT dengan username dan PIN 6 digit." />
    <!-- Terjemahan dari components/theme-script.tsx. -->
    <script>
      try {
        var s = localStorage.getItem("myshift-theme");
        var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (d) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/common.css" />
    <!-- Tanpa defer: skrip inline di <body> memakai Myshift.* saat parsing. -->
    <script src="assets/icons.js"></script>
    <script src="assets/common.js"></script>
  </head>
  <!--
    Ekstraksi dari app/(app)/login/page.tsx. Tanpa shell (data-shell="none").
    Endpoint asli: POST /api/auth/login { username, pin } -> { role, branches }
    (scrypt hash di server — lihat PLAN/FULL-PRD.md bagian auth).
    Parameter ?next=/route didukung seperti aslinya (useSearchParams).
  -->
  <body data-shell="none">
    <main
      id="main"
      class="flex min-h-[100dvh] flex-col items-center justify-center bg-background px-4 py-12 text-foreground"
    >
      <div class="w-full max-w-sm">
        <div class="mb-8 text-center ms-enter-lg">
          <div class="mx-auto mb-3 grid size-12 place-items-center rounded-lg bg-primary text-base font-bold text-primary-foreground shadow-sm">
            MS
          </div>
          <h1 class="text-2xl font-bold tracking-tight">Masuk ke MYSHIFT</h1>
          <p class="mt-1 text-sm text-muted-foreground">Manajemen shift &amp; operasional outlet</p>
        </div>

        <form
          id="login-form"
          class="space-y-5 rounded-lg border border-border bg-card p-4 shadow-sm sm:p-6 ms-enter-lg ms-delay-150"
        >
          <div>
            <!-- Label (components/ui/label.tsx) -->
            <label
              for="username"
              class="flex items-center gap-2 text-sm leading-none font-medium select-none group-data-[disabled=true]:pointer-events-none group-data-[disabled=true]:opacity-50 peer-disabled:cursor-not-allowed peer-disabled:opacity-50"
              >Username</label
            >
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Username petugas"
              autocomplete="username"
              autocapitalize="none"
              required
              class="h-11 w-full min-w-0 rounded-md border border-input bg-card px-4 text-sm text-foreground transition-colors placeholder:text-subtle-foreground hover:border-border focus-visible:border-ring focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-ring disabled:cursor-not-allowed disabled:opacity-50 h-11 w-full rounded-md border border-input bg-background px-3 text-sm"
            />
          </div>

          <div>
            <span
              class="flex items-center gap-2 text-sm leading-none font-medium select-none"
              >PIN (6 digit)</span
            >
            <!-- PinInput: 6 kotak angka (app/(app)/login/page.tsx) -->
            <div id="pin-wrap" class="mt-2">
              <div id="pin-boxes" class="flex justify-center gap-3"></div>
              <button
                type="button"
                id="pin-toggle"
                class="mt-3 flex items-center gap-1.5 text-xs text-muted-foreground hover:text-foreground transition-colors mx-auto"
              ></button>
            </div>
          </div>

          <div
            id="login-error"
            role="alert"
            hidden
            class="rounded-md border border-destructive-wash bg-destructive-wash p-3 text-xs font-medium text-destructive-foreground"
          ></div>

          <!-- Button variant="default" size="lg" + className "h-11 w-full text-base" -->
          <button
            type="submit"
            id="btn-submit"
            disabled
            class="group/button inline-flex shrink-0 items-center justify-center rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/80 h-9 gap-1.5 px-2.5 has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 h-11 w-full text-base"
          >
            Masuk
          </button>
        </form>

        <p class="mt-6 text-center text-xs text-muted-foreground">
          <a href="index.html" class="transition-colors hover:text-foreground hover:underline">← Kembali ke Beranda</a>
        </p>
      </div>
    </main>

    <script>
      /* ====== PinInput (identik dengan app/(app)/login/page.tsx, vanilla JS) ====== */
      var PIN_LEN = 6;
      var pin = "";
      var showPin = false;
      var boxes = document.getElementById("pin-boxes");
      var toggle = document.getElementById("pin-toggle");
      var submitBtn = document.getElementById("btn-submit");
      var errorBox = document.getElementById("login-error");

      function renderBoxes() {
        boxes.innerHTML = "";
        for (var i = 0; i < PIN_LEN; i++) {
          var input = document.createElement("input");
          input.type = showPin ? "text" : "password";
          input.inputMode = "numeric";
          input.pattern = "[0-9]*";
          input.maxLength = 1;
          input.value = pin[i] || "";
          input.setAttribute("aria-label", "Digit " + (i + 1));
          input.className =
            "w-12 h-14 text-center text-xl font-mono font-semibold border border-border rounded-lg bg-background focus:outline-none focus:ring-2 focus:ring-ring focus:border-ring transition-all";
          (function (index) {
            input.addEventListener("input", function (e) {
              var char = e.target.value;
              if (!/^\d$/.test(char)) {
                e.target.value = pin[index] || "";
                return;
              }
              pin = pin.slice(0, index) + char + pin.slice(index + 1);
              e.target.value = char;
              syncSubmit();
              if (index < PIN_LEN - 1) boxes.children[index + 1].focus();
            });
            input.addEventListener("keydown", function (e) {
              if (e.key === "Backspace" && !pin[index] && index > 0) {
                boxes.children[index - 1].focus();
              }
            });
            input.addEventListener("paste", function (e) {
              e.preventDefault();
              var pasted = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, PIN_LEN);
              if (pasted) {
                pin = pasted;
                renderBoxes();
                syncSubmit();
                boxes.children[Math.min(pasted.length, PIN_LEN - 1)].focus();
              }
            });
          })(i);
          boxes.appendChild(input);
        }
        toggle.innerHTML =
          Myshift.icon(showPin ? "eye-off" : "eye", 14) +
          "<span>" + (showPin ? "Sembunyikan" : "Tampilkan") + " PIN</span>";
      }

      function syncSubmit() {
        submitBtn.disabled = pin.length !== PIN_LEN;
      }

      toggle.addEventListener("click", function () {
        showPin = !showPin;
        renderBoxes();
      });
      renderBoxes();
      syncSubmit();
      boxes.children[0].focus();

      /* ====== submit LoginForm ======
         Endpoint asli: POST /api/auth/login (lihat PLAN/API-CONTRACT.md).
         Routing setelah sukses disalin dari login/page.tsx: ?next -> pilih-cabang
         (admin multi-cabang) -> dashboard, selain itu -> jadwal-saya. */
      window.MS_MOCKS = {
        "/api/auth/login": function () {
          var username = document.getElementById("username").value;
          if (!username || username.toLowerCase() === "salah") {
            throw new Error("Username atau PIN salah.");
          }
          return {
            role: username.toLowerCase() === "petugas" ? "petugas" : "admin",
            branches: [
              { branchId: "CBG001", nama: "Cabang Kopo" },
              { branchId: "CBG002", nama: "Cabang Buah Batu" },
            ],
          };
        },
      };

      document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (pin.length !== PIN_LEN) {
          errorBox.textContent = "PIN harus 6 digit angka.";
          errorBox.hidden = false;
          return;
        }
        errorBox.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Memeriksa...";
        try {
          var res = await Myshift.request("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ username: document.getElementById("username").value, pin: pin }),
          });

          var params = new URLSearchParams(location.search);
          var next = params.get("next");
          if (next && next.charAt(0) === "/" && next !== "/login") {
            location.href = Myshift.route(next);
            return;
          }
          if (res.role === "admin" && res.branches && res.branches.length > 1) {
            location.href = "pilih-cabang.html";
          } else if (res.role === "admin") {
            location.href = "dashboard.html";
          } else {
            location.href = "jadwal-saya.html";
          }
        } catch (err) {
          errorBox.textContent = err && err.message ? err.message : "Gagal masuk";
          errorBox.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "Masuk";
        }
      });
    </script>
  </body>
</html>
